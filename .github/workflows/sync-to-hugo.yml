# Sync documentation to Hugo documentation site
# 
# This workflow syncs documentation from kleidia-docs to the Hugo site in yubimgr-main.
# It creates a Pull Request with the changes for review.
#
# Required Secrets:
#   DOCS_SYNC_TOKEN: GitHub PAT with 'repo' scope for the destination repository
#
# To enable:
# 1. Create a PAT at https://github.com/settings/tokens with 'repo' scope
# 2. Add it as a secret named DOCS_SYNC_TOKEN in this repository
# 3. Update DEST_REPO below to your destination repository

name: Sync to Hugo Documentation Site

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'helm/**'
  workflow_dispatch:  # Manual trigger

env:
  # Update this to your destination repository
  DEST_REPO: your-org/yubimgr-main
  HUGO_VERSION: '0.121.2'

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout kleidia-docs (source)
        uses: actions/checkout@v4
        with:
          path: kleidia-docs
      
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEST_REPO }}
          path: yubimgr-main
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
      
      - name: Run sync script
        run: |
          cd yubimgr-main/kleidia-docs-site
          chmod +x sync-docs.sh
          SOURCE_REPO=$GITHUB_WORKSPACE/kleidia-docs ./sync-docs.sh
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      
      - name: Build Hugo site
        run: |
          cd yubimgr-main/kleidia-docs-site
          hugo --minify --gc --cleanDestinationDir
      
      - name: Check for changes
        id: changes
        run: |
          cd yubimgr-main
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          path: yubimgr-main
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          commit-message: |
            docs: sync from kleidia-docs
            
            Source commit: ${{ github.repository }}@${{ github.sha }}
            Triggered by: ${{ github.actor }}
          branch: docs-sync/auto-update
          delete-branch: true
          title: "📚 Auto-sync documentation from kleidia-docs"
          body: |
            ## Documentation Sync
            
            This PR was automatically created by the documentation sync workflow.
            
            **Source Repository**: `${{ github.repository }}`
            **Source Commit**: `${{ github.sha }}`
            **Triggered by**: @${{ github.actor }}
            **Workflow Run**: [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### Changes
            
            - Synced markdown files from `kleidia-docs` to Hugo content structure
            - Rebuilt Hugo static site
            
            ### Review Checklist
            
            - [ ] Verify navigation structure is correct
            - [ ] Check that new pages render properly
            - [ ] Confirm no broken links
            
            ---
            
            *This PR will be auto-merged if the `auto-merge` label is added.*
          labels: |
            documentation
            auto-sync

