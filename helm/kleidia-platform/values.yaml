global:
  namespace: kleidia          # Kubernetes namespace to install into
  registry:
    host: ""                  # Optional: container registry host for all images (required for air-gapped environments)
                              # Example: "registry.example.com:5000"
                              # When set, ALL images will be pulled from this registry
    authSecret: ""            # Optional: docker-registry secret name for private registries
  imagePullSecrets: []        # Optional: list of imagePullSecrets to attach to pods

  # Secrets backend mode. See helm/kleidia-services/values.yaml and docs/EXTERNAL_VAULT.md.
  #   bundled  - this chart installs and operates OpenBao (default).
  #   external - customer-managed Vault/OpenBao; this chart installs NO OpenBao and
  #              points the cert-manager mTLS issuer at the external endpoint.
  #              REQUIRED: also set `openbao.enabled=false` in external mode.
  secretsBackend:
    mode: bundled
  externalVault:
    address: ""                 # REQUIRED in external mode, e.g. "https://vault.corp.example:8200"
    namespace: ""               # Vault Enterprise namespace; empty for OSS/OpenBao
    pkiMount: "pki"             # PKI mount cert-manager signs kleidia-component against
    caSecret: ""                # optional k8s Secret (key ca.crt) for TLS to the external Vault
    appRoleSecret: "kleidia-vault-approle"  # k8s Secret with keys role_id + secret_id (for the cert-manager issuer)
    certManagerRoleId: ""       # AppRole role_id for the cert-manager issuer (literal; role_id is not secret).
                                # secret_id is read from appRoleSecret above.

# =============================================================================
# CLUSTER DEPENDENCIES (Auto-Install)
# =============================================================================
# Kleidia requires cert-manager and CloudNativePG operator in the cluster.
# When install=true (default), the platform chart will automatically install
# these if they are not already present. Set install=false if you manage
# these operators yourself or they are already installed.
#
# The installer checks for existing CRDs before installing -- it will NOT
# reinstall or upgrade operators that already exist in the cluster.
# =============================================================================
dependencies:
  certManager:
    install: true               # Auto-install cert-manager if CRDs not found
    version: "v1.17.1"         # cert-manager release version (pinned for stability)
                                # Update to latest: https://github.com/cert-manager/cert-manager/releases
  cnpg:
    install: true               # Auto-install CNPG operator if CRDs not found
    version: "1.28.1"          # CNPG operator release version (requires K8s 1.32+)
                                # Update to latest: https://github.com/cloudnative-pg/cloudnative-pg/releases

# Third-party image repositories (can be mirrored to private registry for air-gapped deployments)
# When global.registry.host is set, these images will be pulled from: <registry.host>/<repository>:<tag>
thirdPartyImages:
  alpine: "alpine:3.21"
  kubectl: "bitnami/kubectl:latest"  # Used in hooks for Kubernetes API interactions
  busybox: "busybox:1.37"
  curl: "curlimages/curl:latest"     # HTTP client for health checks
  reloader: "ghcr.io/stakater/reloader:v1.2.0"  # Watches secrets/configmaps and triggers rolling restarts
  rancher:
    localPathProvisioner: "rancher/local-path-provisioner:v0.0.24"

# =============================================================================
# RELOADER CONFIGURATION
# =============================================================================
# Stakater Reloader watches for changes to Secrets and ConfigMaps and triggers
# rolling restarts of Deployments/StatefulSets that reference them.
# This enables automatic certificate rotation without manual pod restarts.
# =============================================================================
reloader:
  enabled: true                    # Enable Reloader for automatic secret rotation

# =============================================================================
# STORAGE CONFIGURATION
# =============================================================================
# Kleidia requires persistent storage for OpenBao (Vault) and PostgreSQL.
# Choose ONE of the following storage options:
#
# OPTION 1: Use existing cluster StorageClass (recommended for production)
#   - Set storage.className to your existing StorageClass name
#   - Set storage.localPath.enabled = false
#   - Examples: "nfs-client", "longhorn", "rook-ceph-block", "gp2" (AWS), "managed-premium" (Azure)
#
# OPTION 2: Deploy local-path-provisioner (for single-node or development)
#   - Set storage.localPath.enabled = true
#   - Set storage.className = "local-path"
#   - Ensure the node has sufficient disk space at storage.localPath.path
#
# OPTION 3: Use cloud provider default StorageClass
#   - Set storage.className = "" (empty string)
#   - Kubernetes will use the cluster's default StorageClass
# =============================================================================
storage:
  className: "local-path"      # StorageClass name for all PVCs
                               # Common options: "local-path", "nfs-client", "longhorn", "standard", ""
  localPath:
    enabled: true              # Deploy embedded local-path-provisioner
                               # Set to false if using existing cluster storage
    path: /opt/local-path-provisioner  # Host path for local storage (must exist on nodes)
    reclaimPolicy: Delete      # PV reclaim policy: Delete or Retain

openbao:
  enabled: true
  # Internal TLS between services and OpenBao
  # Can be enabled in two ways:
  #   1. Set internalTLS.enabled=true during install (requires pre-created certs)
  #   2. Enable via admin UI during intermediate CA import (recommended)
  #      This auto-generates server certs using the customer CA
  internalTLS:
    enabled: false          # Set to true to enable TLS
    # Secret containing TLS cert/key for OpenBao server
    # Created automatically when enabling HTTPS via admin UI
    certSecretName: "openbao-internal-tls"
  # Configuration for official OpenBao Helm chart (v0.19.0, appVersion v2.5.4)
  global:
    enabled: true
    tlsDisable: true  # This is overridden by standalone.config when internalTLS.enabled=true
  
  # Disable injector (not needed for our use case)
  injector:
    enabled: false
  
  server:
    enabled: true
    image:
      registry: ""                  # OpenBao image registry (leave empty to use global.registry.host)
                                    # For air-gapped: set global.registry.host and mirror quay.io/openbao/openbao:2.5.4
                                    # Default public registry: "quay.io"
      repository: "openbao/openbao" # OpenBao repository (use "openbao/openbao" for mirrored images)
      tag: "2.5.4"                  # OpenBao version
      pullPolicy: IfNotPresent
    
    # Integrated Raft storage (HA-capable).
    # Raft enables consistent point-in-time snapshots via `bao operator raft
    # snapshot`, which is the supported disaster-recovery path. File storage
    # (the previous backend) has no snapshot API, so its backups silently failed.
    # Single replica by default — valid for raft; raise ha.replicas for true HA.
    #
    # MIGRATION (existing file-storage deploys): this is NOT a hot config flip.
    # OpenBao cannot read file-backed data under a raft config. Follow
    # docs/OPENBAO_RAFT_MIGRATION.md (`bao operator migrate`) before upgrading,
    # or OpenBao will fail to unseal.
    standalone:
      enabled: false

    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true          # Sets BAO_RAFT_NODE_ID from the pod name
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "raft" {
            path = "/openbao/data"
          }

          # Static auto-unseal (OpenBao 2.4.0+).
          # The unseal key is stored in a Kubernetes secret and mounted as a file.
          # Auto-unseal mode: key persists in secret, OpenBao auto-unseals on restart.
          # Manual unseal mode: key cleared from secret, admin provides it via UI.
          #
          # DR WARNING: a raft snapshot is ENCRYPTED and does NOT contain this key.
          # The unseal key + init/recovery keys must be backed up off-cluster
          # (handled by the backup path; see docs) or snapshots cannot be restored.
          seal "static" {
            current_key_id = "kleidia-1"
            current_key = "file:///keys/unseal-kleidia-1.key"
          }

          # service_registration intentionally omitted: single-node raft, and the
          # main service selects on component=server (not the active label), so no
          # pod-label-patch RBAC is required.
    
    # Enable persistent storage
    # NOTE: storageClass is set dynamically via --set during install
    # It should match storage.className from the parent chart
    dataStorage:                 # Persistent storage for OpenBao data
      enabled: true
      size: 10Gi
      storageClass: "local-path" # Must match storage.className (pass via --set)
      accessMode: ReadWriteOnce
    
    # Service account with RBAC for TokenReview API
    # NOTE: ServiceAccount is created by pre-install hook (see templates/hooks/openbao-serviceaccount-hook.yaml)
    # This ensures it exists before the openbao-token secret is created
    serviceAccount:
      create: false  # Created by hook instead
      name: "openbao"
      annotations: {}
    
    # Enable audit storage for production security compliance
    auditStorage:                # Persistent storage for OpenBao audit logs
      enabled: true
      size: 10Gi
      storageClass: "local-path" # Must match storage.className (pass via --set)
      accessMode: ReadWriteOnce
    
    # Mount unseal key for static auto-unseal
    # The secret is managed by the init hook and can be toggled via admin UI
    volumes:
      - name: unseal-key
        secret:
          secretName: openbao-unseal-key
          optional: true  # Allow pod to start even if secret is empty (manual unseal mode)
      # TLS certificates volume (only when internalTLS is enabled)
      # This is conditional and will be empty if TLS is not enabled
    
    volumeMounts:
      - mountPath: /keys
        name: unseal-key
        readOnly: true
      # TLS certificate mount point (used when HTTPS enabled via admin UI)
    
    # Resources
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
  
  # UI disabled (using backend UI)
  ui:
    enabled: false
  
  # PKI configuration (will be handled by hooks)
  pki:
    mode: root              # PKI engine mode: "root" or "intermediate"
    rootCA:
      commonName: "Kleidia Root CA"
      ttl: "87600h"   # 10 years
    intermediate:
      commonName: "Kleidia Intermediate CA"
      ttl: "43800h"   # 5 years
      customerRootCA: ""  # Base64-encoded customer root CA cert (required when mode=intermediate)
    
    # PKI URL configuration for certificate distribution
    # These URLs are embedded into every issued certificate for CRL and CA chain retrieval.
    # IMPORTANT: Once certificates are issued, the URLs cannot be changed without re-issuing.
    #
    # URL auto-detection (no manual configuration needed):
    #   1. If global.siteUrl is set → uses {siteUrl}/api/pki
    #   2. If global.domain is set → uses https://{domain}/api/pki
    #   3. Otherwise → uses internal Kubernetes URL (not accessible externally)
    #
    # The backend proxies CRL/CA requests with in-memory caching for performance.
    # Resulting URLs embedded in certificates:
    #   CRL:      https://your-domain.com/api/pki/crl
    #   CA:       https://your-domain.com/api/pki/ca
    urls:
      # Optional: Override auto-detected PKI URL (rarely needed)
      # Only set this if you need a different URL than {siteUrl}/api/pki
      externalBaseUrl: ""
      # CRL validity period (default: 24h)
      # Should match or exceed your CRL cache refresh interval
      crlExpiry: "24h"

certManager:
  install: false             # Set true if cert-manager should create Vault Issuer
  testCertificate: false     # Leave false (we do not use cert-manager for app TLS)

# External Secrets Operator configuration
# Syncs secrets from OpenBao to Kubernetes Secrets
externalSecrets:
  enabled: false             # Set to true to enable ESO integration
  # Note: ESO must be installed separately in the cluster
  # Install with: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
