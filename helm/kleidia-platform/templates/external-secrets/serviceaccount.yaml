{{- if .Values.externalSecrets.enabled }}
# ServiceAccount for External Secrets Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secret-sync
---
# ClusterRoleBinding to allow ESO to access secrets across namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-controller
  labels:
    app.kubernetes.io/name: external-secrets
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: ClusterRole
  name: external-secrets-controller
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole for ESO to manage secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-controller
  labels:
    app.kubernetes.io/name: external-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "delete", "patch", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "externalsecrets/status", "externalsecrets/finalizers", "secretstores", "secretstores/status", "clustersecretstores", "clustersecretstores/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["clusterexternalsecrets", "clusterexternalsecrets/status", "clusterexternalsecrets/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
{{- end }}

