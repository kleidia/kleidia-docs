{{- if .Values.externalSecrets.enabled }}
# ClusterSecretStore for External Secrets Operator
# Connects ESO to OpenBao using Kubernetes ServiceAccount authentication
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: secret-store
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "25"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  provider:
    vault:
      # OpenBao server address (internal K8s service)
      {{- if and .Values.openbao.enabled .Values.openbao.internalTLS.enabled }}
      server: "https://kleidia-platform-openbao.{{ .Values.global.namespace }}.svc.cluster.local:8200"
      caBundle: ""
      caBundleSecretRef:
        name: openbao-internal-ca-tls
        key: ca.crt
      {{- else }}
      server: "http://kleidia-platform-openbao.{{ .Values.global.namespace }}.svc.cluster.local:8200"
      {{- end }}
      
      # KV v2 secrets engine mount path
      path: "yubikeys"
      version: "v2"
      
      # Kubernetes ServiceAccount authentication
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: {{ .Values.global.namespace }}
{{- end }}

