{{- if .Values.openbao.enabled }}
---
# OpenBao Unseal Key Secret (static seal)
# This secret holds the static unseal key for OpenBao.
#
# Auto-unseal mode: Key is populated, OpenBao reads it on startup and auto-unseals
# Manual unseal mode: Key is empty/cleared, admin must provide via UI after pod restart
#
# CRITICAL: the key value is PRESERVED across `helm upgrade` via `lookup`.
# OpenBao's stored data (raft/file) is ENCRYPTED with this key. Regenerating it on
# upgrade re-seals OpenBao with a key that can't decrypt the data ("message
# authentication failed") and breaks auto-unseal. So we only generate a fresh key
# on first install; thereafter we re-emit whatever is already stored (including an
# intentionally-cleared value for manual-unseal mode).
#
# This is a regular resource (not a hook) so it's created with the namespace and
# before the StatefulSet.
{{- $ns := .Values.global.namespace }}
{{- $existing := lookup "v1" "Secret" $ns "openbao-unseal-key" }}
{{- $keyData := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "unseal-kleidia-1.key") }}
{{-   $keyData = index $existing.data "unseal-kleidia-1.key" }}
{{- else }}
{{-   $keyData = randAlphaNum 32 | b64enc | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: openbao-unseal-key
  namespace: {{ $ns }}
  labels:
    app: openbao
    component: unseal-key
  annotations:
    # Keep this secret on helm uninstall (preserves unseal key for upgrades)
    helm.sh/resource-policy: keep
type: Opaque
data:
  # base64 of the static seal key file. Preserved across upgrades (see above).
  # NOTE: `lookup` is empty during `helm template`/--dry-run, so a render-only run
  # shows a throwaway value; real install/upgrade against the cluster preserves it.
  unseal-kleidia-1.key: {{ $keyData | quote }}
{{- end }}

