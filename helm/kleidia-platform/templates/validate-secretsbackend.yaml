{{- /*
Guard: external secrets-backend mode must not also install the bundled OpenBao.
Helm subchart conditions can't express this, so fail fast with a clear message.
*/ -}}
{{- if eq (.Values.global.secretsBackend.mode | default "bundled") "external" }}
{{-   if .Values.openbao.enabled }}
{{-     fail "secretsBackend.mode=external requires openbao.enabled=false (do not install the bundled OpenBao when using a customer-managed external Vault). See docs/EXTERNAL_VAULT.md." }}
{{-   end }}
{{-   if not .Values.global.externalVault.address }}
{{-     fail "secretsBackend.mode=external requires global.externalVault.address to be set." }}
{{-   end }}
{{- end }}
