{{- if .Values.reloader.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reloader
  namespace: {{ .Values.global.namespace }}
  labels:
    app: reloader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reloader-{{ .Values.global.namespace }}
  labels:
    app: reloader
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
    verbs:
      - list
      - get
      - update
      - patch
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - list
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reloader-{{ .Values.global.namespace }}
  labels:
    app: reloader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reloader-{{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: reloader
    namespace: {{ .Values.global.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader
  namespace: {{ .Values.global.namespace }}
  labels:
    app: reloader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reloader
  template:
    metadata:
      labels:
        app: reloader
    spec:
      serviceAccountName: reloader
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- else if .Values.global.registry.authSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.registry.authSecret }}
      {{- end }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reloader
          image: {{ include "kleidia-platform.thirdPartyImage" (dict "image" .Values.thirdPartyImages.reloader "context" $) }}
          imagePullPolicy: IfNotPresent
          env:
            # Only watch our namespace
            - name: RELOADER_WATCH_GLOBALLY
              value: "false"
            - name: RELOADER_NAMESPACE
              value: {{ .Values.global.namespace | quote }}
            # Enable auto annotation mode (reloader.stakater.com/auto: "true")
            - name: RELOADER_RELOAD_STRATEGY
              value: "annotations"
            # Log level
            - name: RELOADER_LOG_FORMAT
              value: "json"
            # CPU and memory limits for Go runtime
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: "1"
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
{{- end }}

