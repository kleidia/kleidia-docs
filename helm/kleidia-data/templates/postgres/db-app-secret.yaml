{{- $useCNPG := eq (include "kleidia-data.useCNPG" .) "true" }}
{{- if and .Values.postgres.enabled (not $useCNPG) }}
# =============================================================================
# Legacy PostgreSQL Application Secret
# =============================================================================
# In CNPG mode, the operator auto-creates the kleidia-db-app secret.
# In legacy mode (trust auth), we create it with an empty password so the
# schema-init job and backend deployment can reference it without errors.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: kleidia-db-app
  namespace: {{ .Values.global.namespace }}
  labels:
    app: postgres
    app.kubernetes.io/component: database
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.username }}
  password: ""
  host: postgres.{{ .Values.global.namespace }}.svc.cluster.local
  port: "5432"
  dbname: {{ .Values.postgres.database }}
{{- end }}
