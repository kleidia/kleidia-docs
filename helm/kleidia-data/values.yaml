global:
  namespace: kleidia          # Kubernetes namespace to install into
  registry:
    host: ""                  # Optional: container registry host for all images (required for air-gapped environments)
                              # Example: "registry.example.com:5000"
                              # When set, ALL images will be pulled from this registry
    authSecret: ""            # Optional: docker-registry secret name for private registries
  imagePullSecrets: []        # Optional: list of imagePullSecrets to attach to pods

# Third-party image repositories (can be mirrored to private registry for air-gapped deployments)
# When global.registry.host is set, these images will be pulled from: <registry.host>/<repository>:<tag>
thirdPartyImages:
  postgres: "postgres:18.1-alpine"   # PostgreSQL database image (used for legacy mode)
  # CNPG PostgreSQL image - uses default from CNPG v1.28.0 (Dec 2025)
  # See: https://github.com/cloudnative-pg/cloudnative-pg/releases/tag/v1.28.0
  cnpg: "ghcr.io/cloudnative-pg/postgresql:18.1"  # PostgreSQL 18.1 (CNPG default)
  kubectl: "alpine/k8s:1.28.4"   # kubectl+bash image for the mTLS issuer-readiness gate (pre-install hook)

# =============================================================================
# STORAGE CONFIGURATION
# =============================================================================
# Must match the storage.className used in kleidia-platform chart.
# The StorageClass is created by kleidia-platform (if using local-path-provisioner)
# or should already exist in your cluster.
# =============================================================================
storage:
  className: "local-path"      # StorageClass name for PostgreSQL PVC
                               # Must match kleidia-platform storage.className

# =============================================================================
# POSTGRESQL CONFIGURATION
# =============================================================================
# Two modes available:
#   1. cnpg.enabled=true (recommended) - CloudNativePG operator with auto TLS, backups, HA
#   2. cnpg.enabled=false - Simple StatefulSet (legacy, no TLS, no auto backup)
# =============================================================================
postgres:
  enabled: true               # Enable PostgreSQL (set to false only if using external DB)
  database: kleidia           # Database name
  username: kleidiauser       # Database user
  storage:
    size: 10Gi                # PVC size for Postgres data

# =============================================================================
# CLOUDNATIVEPG CONFIGURATION (Recommended for K8s 1.32+)
# =============================================================================
# CloudNativePG v1.28.0 provides:
#   - Automatic TLS with cert-manager integration
#   - Certificate hot-reload (no pod restarts needed)
#   - Continuous WAL archiving to S3
#   - Point-in-time recovery (PITR)
#   - High availability with automatic failover (2-node cluster by default)
#
# AUTOMATIC MODE SELECTION:
#   - Kubernetes >= 1.32: CNPG operator is used (2-node HA cluster)
#   - Kubernetes < 1.32:  Legacy StatefulSet is used (single node, no HA, no TLS)
#   - Set cnpg.enabled=false to force legacy mode on any K8s version
#
# Prerequisites (for K8s 1.32+):
#   1. CNPG operator is installed by kleidia-platform chart
#   2. Configure S3 backup credentials via frontend UI (stored in OpenBao)
#
# Supported versions (CNPG v1.28.0):
#   - Kubernetes: 1.32, 1.33, 1.34
#   - PostgreSQL: 14, 15, 16, 17, 18 (default: 18.1)
#
# See: https://github.com/cloudnative-pg/cloudnative-pg/releases/tag/v1.28.0
# =============================================================================
cnpg:
  enabled: true               # Auto-detect: true=use CNPG if K8s>=1.33, false=force legacy mode
  
  # PostgreSQL version (CNPG v1.28.0 default: 18.1)
  version: "18"
  
  # Number of instances (2 = HA with automatic failover, default when CNPG is used)
  # Set to 1 for single-node or 3 for higher availability
  instances: 2
  
  # PostgreSQL configuration parameters
  parameters:
    shared_buffers: "256MB"
    max_connections: "100"
    effective_cache_size: "512MB"
    work_mem: "16MB"
    maintenance_work_mem: "64MB"
    # Force a WAL segment switch at least this often so an IDLE database still
    # archives WAL to S3 — without it, PITR has no recent recoverable point and a
    # base backup's trailing WAL may never reach the archive. (Validated in a live
    # DR drill: an idle cluster left the backup's start WAL unarchived.)
    archive_timeout: "300s"
  
  # TLS Configuration
  # When enabled, CNPG automatically manages certificates via cert-manager.
  # Requires kleidia-mtls-issuer (created by kleidia-platform chart post-install hook).
  tls:
    enabled: true
    # Use cert-manager to issue certificates (recommended)
    certManager:
      enabled: true
      issuerRef:
        name: kleidia-mtls-issuer
        kind: Issuer
    # Certificate duration and renewal
    duration: "8760h"         # 1 year
    renewBefore: "720h"       # 30 days before expiry
  
  # Backup Configuration (CNPG in-tree barmanObjectStore -> S3, gives PITR).
  # Leave enabled=false for UI-managed backups: the backend stores S3 creds in
  # OpenBao, creates s3CredentialsSecret, and patches the Cluster's .spec.backup
  # at runtime. Set enabled=true + destinationPath here only for declarative
  # (GitOps) installs where S3 is known at install time.
  # Do not enable declarative mode after the UI has created backup resources:
  # Helm and the backend would then compete for ownership of the same objects.
  backup:
    enabled: false
    # S3 credentials secret name. In UI-managed mode the backend CREATES this
    # secret (name is hardcoded there as cnpg-backup-s3-credentials) and patches
    # the cluster — so do NOT change this unless you also override the backend's
    # CNPG_S3_SECRET_NAME env, or backups/restore will reference a missing secret.
    # Must hold keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION.
    s3CredentialsSecret: "cnpg-backup-s3-credentials"
    # Full S3 destination, e.g. "s3://my-bucket/kleidia". REQUIRED when enabled=true.
    destinationPath: ""
    # S3-compatible endpoint (omit for AWS S3); e.g. "https://s3.eu-north-1.amazonaws.com"
    # or a MinIO URL. Leave empty for AWS.
    endpointURL: ""
    # Archive stanza name. Restores MUST use a different serverName to avoid
    # clobbering this cluster's WAL archive.
    serverName: "kleidia-db"
    # Retention policy (deprecated field in CNPG 1.28 but still honoured in-tree).
    retentionPolicy: "30d"
    # WAL compression + parallelism
    walCompression: gzip
    walMaxParallel: 2
    # Data (base backup) compression
    dataCompression: gzip
  
  # Resource configuration
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# =============================================================================
# SCHEDULED BACKUP CONFIGURATION
# =============================================================================
# Schedule is configured via frontend UI and stored in a ConfigMap
# The backend updates this ConfigMap when schedule changes
# =============================================================================
scheduledBackup:
  enabled: true
  # CloudNativePG uses a six-field, seconds-first cron dialect.
  schedule: "0 0 2 * * *"     # Daily at 2 AM UTC
  # Backup owner reference (for garbage collection)
  backupOwnerReference: self
