{{- if and .Values.externalSecrets.enabled .Values.backup.enableVaultBackup }}
# ExternalSecret for Backup S3 Credentials
# Syncs S3 credentials from OpenBao for backup jobs
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backup-s3-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backup
    app.kubernetes.io/component: external-secret
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: backup-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app: backup
          managed-by: external-secrets
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: backup/s3
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: backup/s3
        property: secret_access_key
    - secretKey: S3_BUCKET
      remoteRef:
        key: backup/s3
        property: bucket
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: backup/s3
        property: endpoint
{{- end }}

