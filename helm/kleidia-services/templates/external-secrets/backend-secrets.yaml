{{- if .Values.externalSecrets.enabled }}
# ExternalSecret for Backend Service
# Syncs secrets from OpenBao KV to Kubernetes Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backend
    app.kubernetes.io/component: external-secret
spec:
  # Refresh interval - how often to check OpenBao for updates
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  
  # Reference to the ClusterSecretStore (created by kleidia-platform)
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  
  # Target Kubernetes Secret to create/update
  target:
    name: backend-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app: backend
          managed-by: external-secrets
  
  # Data mappings from OpenBao to K8s Secret keys
  data:
    # JWT secret for token signing
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret
        property: value
    
    # Encryption key for backend data encryption
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: encryption-key
        property: value
{{- end }}

