{{- if .Values.licenseService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: license-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: license-service
    app.kubernetes.io/name: kleidia-license
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: license-service
spec:
  replicas: {{ .Values.licenseService.replicas }}
  selector:
    matchLabels:
      app: license-service
  template:
    metadata:
      labels:
        app: license-service
        app.kubernetes.io/name: kleidia-license
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: license-service
      annotations:
        # Reloader: automatically restart pods when referenced secrets change
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: license-service
      # Graceful shutdown: allow 45 seconds for connections to drain
      terminationGracePeriodSeconds: 45
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- else if .Values.global.registry.authSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.registry.authSecret }}
      {{- end }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.mtls.enabled }}
      # Wait for mTLS certificate to be ready
      initContainers:
      - name: wait-for-cert
        image: busybox:1.36
        command: ['sh', '-c', 'until [ -f /tls/tls.crt ]; do echo "Waiting for mTLS certificate..."; sleep 2; done; echo "Certificate ready"']
        volumeMounts:
        - name: mtls-certs
          mountPath: /tls
          readOnly: true
      {{- end }}
      containers:
      - name: license-service
        image: {{ if .Values.global.registry.host }}{{ .Values.global.registry.host }}/{{ end }}{{ .Values.licenseService.image }}
        imagePullPolicy: {{ .Values.licenseService.imagePullPolicy | default "Always" }}
        ports:
        - name: {{ if .Values.mtls.enabled }}https{{ else }}http{{ end }}
          containerPort: 8081
          protocol: TCP
        {{- if .Values.mtls.enabled }}
        - name: health
          containerPort: 9001
          protocol: TCP
        {{- end }}
        env:
        {{- $ext := eq (.Values.global.secretsBackend.mode | default "bundled") "external" }}
        - name: VAULT_AUTH_METHOD
          value: "approle"
        - name: VAULT_ROLE
          value: "license-service"
        {{- if $ext }}
        - name: VAULT_ADDR
          value: {{ required "global.externalVault.address is required when secretsBackend.mode=external" .Values.global.externalVault.address | quote }}
        - name: VAULT_KV_MOUNT
          value: {{ .Values.global.externalVault.kvMount | default "yubikeys" | quote }}
        - name: VAULT_ROLE_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalVault.appRoleSecret | default "kleidia-vault-approle" }}
              key: role_id
        - name: VAULT_SECRET_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalVault.appRoleSecret | default "kleidia-vault-approle" }}
              key: secret_id
        {{- if .Values.global.externalVault.namespace }}
        - name: VAULT_NAMESPACE
          value: {{ .Values.global.externalVault.namespace | quote }}
        {{- end }}
        {{- if .Values.global.externalVault.caSecret }}
        - name: VAULT_CACERT
          value: /etc/vault-tls/ca.crt
        {{- end }}
        {{- if .Values.global.externalVault.tlsSkipVerify }}
        - name: VAULT_SKIP_VERIFY
          value: "true"
        {{- end }}
        {{- else }}
        - name: VAULT_ADDR
          value: "http://kleidia-platform-openbao.{{ .Values.global.namespace }}.svc.cluster.local:8200"
        - name: VAULT_ROLE_ID
          valueFrom:
            secretKeyRef:
              name: openbao-license-approle
              key: role_id
        - name: VAULT_SECRET_ID
          valueFrom:
            secretKeyRef:
              name: openbao-license-approle
              key: secret_id
        {{- end }}
        - name: PORT
          value: "8081"
        {{- if .Values.mtls.enabled }}
        # mTLS Configuration
        - name: TLS_ENABLED
          value: "true"
        - name: TLS_CERT_FILE
          value: "/tls/tls.crt"
        - name: TLS_KEY_FILE
          value: "/tls/tls.key"
        - name: TLS_CA_FILE
          value: "/tls/ca.crt"
        {{- else }}
        - name: TLS_ENABLED
          value: "false"
        {{- end }}
        {{- $extCA := and (eq (.Values.global.secretsBackend.mode | default "bundled") "external") .Values.global.externalVault.caSecret }}
        {{- if or .Values.mtls.enabled $extCA }}
        volumeMounts:
        {{- if .Values.mtls.enabled }}
        - name: mtls-certs
          mountPath: /tls
          readOnly: true
        {{- end }}
        {{- if $extCA }}
        - name: vault-ca
          mountPath: /etc/vault-tls
          readOnly: true
        {{- end }}
        {{- end }}
        resources:
          requests:
            memory: {{ .Values.licenseService.resources.requests.memory | default "32Mi" }}
            cpu: {{ .Values.licenseService.resources.requests.cpu | default "50m" }}
          limits:
            memory: {{ .Values.licenseService.resources.limits.memory | default "128Mi" }}
            cpu: {{ .Values.licenseService.resources.limits.cpu | default "200m" }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ if .Values.mtls.enabled }}9001{{ else }}8081{{ end }}
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: {{ if .Values.mtls.enabled }}9001{{ else }}8081{{ end }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # Graceful shutdown: wait for load balancer to drain connections
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: ["ALL"]
      {{- $extCAv := and (eq (.Values.global.secretsBackend.mode | default "bundled") "external") .Values.global.externalVault.caSecret }}
      {{- if or .Values.mtls.enabled $extCAv }}
      volumes:
      {{- if .Values.mtls.enabled }}
      - name: mtls-certs
        secret:
          secretName: license-service-mtls-tls
      {{- end }}
      {{- if $extCAv }}
      - name: vault-ca
        secret:
          secretName: {{ .Values.global.externalVault.caSecret }}
          items:
            - key: ca.crt
              path: ca.crt
      {{- end }}
      {{- end }}
{{- end }}

