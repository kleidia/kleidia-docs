apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Reloader: automatically restart pods when referenced secrets change
        # This enables zero-downtime certificate rotation
        reloader.stakater.com/auto: "true"
    spec:
      # Graceful shutdown: allow 45 seconds for connections to drain
      terminationGracePeriodSeconds: 45
      serviceAccountName: backend
      {{- /* Registry authentication: prefer explicit global.imagePullSecrets, else fallback to global.registry.authSecret */}}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- else if .Values.global.registry.authSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.registry.authSecret }}
      {{- end }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # Wait for PostgreSQL - uses postgres image with pg_isready
      - name: wait-for-postgres
        image: {{ include "kleidia-services.thirdPartyImage" (dict "image" .Values.thirdPartyImages.postgres "context" $) }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: ["ALL"]
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: kleidia-db-app
              key: password
        {{- if .Values.database.tls.enabled }}
        - name: PGSSLMODE
          value: {{ .Values.database.tls.sslMode | quote }}
        - name: PGSSLCERT
          value: "/db-tls/tls.crt"
        - name: PGSSLKEY
          value: "/db-tls/tls.key"
        - name: PGSSLROOTCERT
          value: "/db-tls/ca.crt"
        {{- end }}
        {{- if .Values.database.tls.enabled }}
        volumeMounts:
          - name: db-tls-certs
            mountPath: /db-tls
            readOnly: true
        {{- end }}
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL..."
          {{- if .Values.database.tls.enabled }}
          echo "TLS mode: {{ .Values.database.tls.sslMode }}"
          {{- end }}
          
          # Wait for PostgreSQL to accept connections
          until pg_isready -h postgres.{{ .Values.global.namespace }}.svc.cluster.local -p 5432 -U kleidiauser 2>/dev/null; do
            echo "PostgreSQL not ready yet..."
            sleep 2
          done
          
          echo "PostgreSQL is accepting connections, verifying database exists..."
          
          # Verify database exists and is accessible
          MAX_ATTEMPTS=30
          ATTEMPT=0
          until psql -h postgres.{{ .Values.global.namespace }}.svc.cluster.local -U kleidiauser -d kleidia -c "SELECT 1" >/dev/null 2>&1; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "❌ Failed to connect to kleidia database after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Database not accessible yet (attempt $ATTEMPT/$MAX_ATTEMPTS)..."
            sleep 2
          done
          
          echo "✅ PostgreSQL ready and database accessible!"
      # Wait for OpenBao - uses curl image for health checks
      - name: wait-for-openbao
        image: {{ include "kleidia-services.thirdPartyImage" (dict "image" .Values.thirdPartyImages.curl "context" $) }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: ["ALL"]
        command:
        - sh
        - -c
        - |
          echo "Waiting for OpenBao..."
          {{- if eq (.Values.global.secretsBackend.mode | default "bundled") "external" }}
          BAO_HEALTH="{{ required "global.externalVault.address is required in external mode" .Values.global.externalVault.address }}/v1/sys/health"
          {{- else }}
          BAO_HEALTH="http://kleidia-platform-openbao.{{ .Values.global.namespace }}.svc.cluster.local:8200/v1/sys/health"
          {{- end }}
          until curl -sf "$BAO_HEALTH" >/dev/null 2>&1; do
            echo "OpenBao not ready yet..."
            sleep 2
          done
          echo "✅ OpenBao ready!"
      {{- if .Values.mtls.enabled }}
      # Wait for mTLS certificate to be ready
      - name: wait-for-certificate
        image: {{ include "kleidia-services.thirdPartyImage" (dict "image" .Values.thirdPartyImages.curl "context" $) }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: mtls-certs
            mountPath: /tls
            readOnly: true
        command:
        - sh
        - -c
        - |
          echo "Waiting for mTLS certificate..."
          while [ ! -f /tls/tls.crt ] || [ ! -f /tls/tls.key ]; do
            echo "Certificate not ready yet..."
            sleep 2
          done
          echo "✅ mTLS certificate ready!"
      {{- end }}
      containers:
      - name: backend
        image: "{{ if .Values.global.registry.host }}{{ .Values.global.registry.host }}/{{ end }}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        {{- if .Values.mtls.enabled }}
        - containerPort: 8443
          name: mtls
        - containerPort: 9000
          name: health
        {{- end }}
        env:
        # Kleidia platform version — surfaced in the admin overview. Sourced from the
        # chart appVersion so the displayed version always matches the deployed release.
        - name: APP_VERSION
          value: {{ .Chart.AppVersion | quote }}
        # Database connection
        - name: DB_HOST
          value: postgres.{{ .Values.global.namespace }}.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: kleidiauser
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kleidia-db-app
              key: password
        - name: DB_NAME
          value: kleidia
        {{- if .Values.database.tls.enabled }}
        # PostgreSQL TLS configuration (CNPG mode)
        - name: DB_SSL_MODE
          value: {{ .Values.database.tls.sslMode | quote }}
        - name: DB_SSL_CERT
          value: "/db-tls/tls.crt"
        - name: DB_SSL_KEY
          value: "/db-tls/tls.key"
        - name: DB_SSL_ROOT_CERT
          value: "/db-tls/ca.crt"
        {{- else }}
        # No TLS (legacy mode or TLS disabled)
        - name: DB_SSL_MODE
          value: "disable"
        {{- end }}
        
        # Secrets backend (AppRole auth). Mode = bundled (in-cluster OpenBao) or external (customer Vault).
        {{- $ext := eq (.Values.global.secretsBackend.mode | default "bundled") "external" }}
        - name: VAULT_ENABLED
          value: "true"
        - name: SECRETS_BACKEND_MODE
          value: {{ .Values.global.secretsBackend.mode | default "bundled" | quote }}
        - name: VAULT_AUTH_METHOD
          value: approle
        {{- if $ext }}
        - name: VAULT_ADDR
          value: {{ required "global.externalVault.address is required when secretsBackend.mode=external" .Values.global.externalVault.address | quote }}
        - name: VAULT_ROLE_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalVault.appRoleSecret | default "kleidia-vault-approle" }}
              key: role_id
        - name: VAULT_SECRET_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalVault.appRoleSecret | default "kleidia-vault-approle" }}
              key: secret_id
        - name: VAULT_KV_MOUNT
          value: {{ .Values.global.externalVault.kvMount | default "yubikeys" | quote }}
        - name: VAULT_PKI_MOUNT
          value: {{ .Values.global.externalVault.pkiMount | default "pki" | quote }}
        {{- if .Values.global.externalVault.namespace }}
        - name: VAULT_NAMESPACE
          value: {{ .Values.global.externalVault.namespace | quote }}
        {{- end }}
        {{- if .Values.global.externalVault.caSecret }}
        - name: VAULT_CACERT
          value: /etc/vault-tls/ca.crt
        {{- end }}
        {{- if .Values.global.externalVault.tlsSkipVerify }}
        - name: VAULT_SKIP_VERIFY
          value: "true"
        {{- end }}
        {{- else }}
        - name: VAULT_ADDR
          value: http://kleidia-platform-openbao.{{ .Values.global.namespace }}.svc.cluster.local:8200
        - name: VAULT_ROLE_ID
          valueFrom:
            secretKeyRef:
              name: openbao-backend-approle
              key: role_id
        - name: VAULT_SECRET_ID
          valueFrom:
            secretKeyRef:
              name: openbao-backend-approle
              key: secret_id
        - name: VAULT_KV_MOUNT
          value: "yubikeys"
        {{- end }}
        - name: VAULT_KV_JWT_PATH
          value: "jwt-secret"
        - name: VAULT_KV_ENCRYPTION_PATH
          value: "encryption-key"
        - name: VAULT_KV_DATABASE_PATH
          value: "database"
        
        # Application config
        - name: SERVER_PORT
          value: "8080"
        - name: LOG_LEVEL
          value: info
        - name: CORS_ORIGINS
          {{- $corsOrigins := .Values.backend.corsOrigins }}
          {{- if not $corsOrigins }}
            {{- if .Values.global.siteUrl }}
              {{- $corsOrigins = .Values.global.siteUrl }}
            {{- else if .Values.global.domain }}
              {{- $corsOrigins = printf "https://%s" .Values.global.domain }}
            {{- else }}
              {{- $corsOrigins = "https://kleidia.example.com" }}
            {{- end }}
          {{- end }}
          value: {{ $corsOrigins | quote }}
        
        # License service connection (mTLS)
        {{- if .Values.mtls.enabled }}
        - name: LICENSE_SERVICE_URL
          value: "https://license-service.{{ .Values.global.namespace }}.svc.cluster.local:8081"
        # mTLS Configuration (TLS 1.3 for all intra-cluster communication)
        # Dual-port architecture: 8080=HTTP (HAProxy), 8443=mTLS (internal), 9000=health
        - name: TLS_ENABLED
          value: "true"
        - name: MTLS_PORT
          value: "8443"
        - name: TLS_CERT_FILE
          value: "/tls/tls.crt"
        - name: TLS_KEY_FILE
          value: "/tls/tls.key"
        - name: TLS_CA_FILE
          value: "/tls/ca.crt"
        - name: TLS_CLIENT_AUTH
          value: {{ .Values.mtls.clientAuth | default "require" | quote }}
        {{- else }}
        - name: LICENSE_SERVICE_URL
          value: "http://license-service.{{ .Values.global.namespace }}.svc.cluster.local:8081"
        - name: TLS_ENABLED
          value: "false"
        {{- end }}
        
        # OIDC Configuration
        - name: OIDC_SKIP_TLS_VERIFY
          value: "{{ .Values.backend.oidc.skipTlsVerify | default "false" }}"
        {{- if .Values.backend.oidc.discoveryBase }}
        - name: OIDC_DISCOVERY_BASE
          value: "{{ .Values.backend.oidc.discoveryBase }}"
        {{- end }}
        
        {{- if ne (.Values.global.secretsBackend.mode | default "bundled") "external" }}
        # Backup runner token (for bundled OpenBao snapshot authentication)
        - name: BACKUP_RUNNER_TOKEN
          valueFrom:
            secretKeyRef:
              name: backup-runner-token
              key: token
        {{- end }}
        # CNPG backup S3 credentials secret name. Must match the kleidia-data
        # chart's cnpg.backup.s3CredentialsSecret if you override its default.
        - name: CNPG_S3_SECRET_NAME
          value: "{{ .Values.backend.cnpgS3SecretName | default "cnpg-backup-s3-credentials" }}"

        readinessProbe:
          httpGet:
            path: /health
            port: {{ if .Values.mtls.enabled }}9000{{ else }}8080{{ end }}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        
        livenessProbe:
          httpGet:
            path: /health
            port: {{ if .Values.mtls.enabled }}9000{{ else }}8080{{ end }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        
        resources:
          requests:
            memory: {{ .Values.backend.resources.requests.memory | quote }}
            cpu: {{ .Values.backend.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.backend.resources.limits.memory | quote }}
            cpu: {{ .Values.backend.resources.limits.cpu | quote }}
        volumeMounts:
        {{- if .Values.mtls.enabled }}
          - name: mtls-certs
            mountPath: /tls
            readOnly: true
        {{- end }}
        {{- if .Values.database.tls.enabled }}
          - name: db-tls-certs
            mountPath: /db-tls
            readOnly: true
        {{- end }}
        {{- if and (eq (.Values.global.secretsBackend.mode | default "bundled") "external") .Values.global.externalVault.caSecret }}
          - name: vault-ca
            mountPath: /etc/vault-tls
            readOnly: true
        {{- end }}
        # Graceful shutdown: wait for load balancer to drain connections
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: ["ALL"]
      volumes:
      {{- if and (eq (.Values.global.secretsBackend.mode | default "bundled") "external") .Values.global.externalVault.caSecret }}
        - name: vault-ca
          secret:
            secretName: {{ .Values.global.externalVault.caSecret }}
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0400
      {{- end }}
      {{- if .Values.mtls.enabled }}
        - name: mtls-certs
          secret:
            secretName: backend-mtls-tls
            defaultMode: 0400
      {{- end }}
      {{- if .Values.database.tls.enabled }}
        # Database TLS certificates (client cert + CA)
        # Combines client cert from kleidia-db-client-tls and CA from kleidia-db-ca
        - name: db-tls-certs
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ .Values.database.tls.clientCertSecret }}
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - secret:
                  name: {{ .Values.database.tls.caSecret }}
                  items:
                    - key: ca.crt
                      path: ca.crt
      {{- end }}
