{{- if .Values.backend.metrics.serviceMonitor.enabled }}
{{- if not .Values.backend.metrics.service.enabled }}
{{- fail "backend.metrics.serviceMonitor.enabled requires backend.metrics.service.enabled=true (the ServiceMonitor scrapes the backend-metrics Service)" }}
{{- end }}
# Prometheus Operator scrape config for the backend-metrics Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backend
    app.kubernetes.io/component: metrics
    {{- with .Values.backend.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}
  selector:
    matchLabels:
      app: backend
      app.kubernetes.io/component: metrics
  endpoints:
  - port: metrics
    path: /metrics
    scheme: http
    interval: {{ .Values.backend.metrics.serviceMonitor.interval }}
    scrapeTimeout: {{ .Values.backend.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
