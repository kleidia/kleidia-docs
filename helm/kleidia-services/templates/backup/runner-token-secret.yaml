{{- if eq (.Values.global.secretsBackend.mode | default "bundled") "external" }}
# =============================================================================
# Backup runner token (external mode only)
# =============================================================================
# The backend's internal backup runner authenticates with this token. In BUNDLED
# mode it is created by the OpenBao setup hook (kleidia-platform). In EXTERNAL mode
# that hook does not run, so the services chart provisions it here — otherwise the
# backend pod fails with CreateContainerConfigError ("backup-runner-token" not found).
# Value is preserved across upgrades via lookup; kept on uninstall.
{{- $ns := .Values.global.namespace }}
{{- $existing := lookup "v1" "Secret" $ns "backup-runner-token" }}
{{- $token := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "token") }}
{{-   $token = index $existing.data "token" }}
{{- else }}
{{-   $token = randAlphaNum 40 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: backup-runner-token
  namespace: {{ $ns }}
  labels:
    app: backup
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ $token | quote }}
{{- end }}
