{{- if ne (.Values.global.secretsBackend.mode | default "bundled") "external" }}
# =============================================================================
# Backup runner token (bundled mode only)
# =============================================================================
# The backend's internal OpenBao snapshot runner authenticates with this token.
# Value is preserved across upgrades via lookup. Helm ownership metadata lets a
# token created by the bundled OpenBao setup flow be managed by this release.
{{- $ns := .Values.global.namespace }}
{{- $existing := lookup "v1" "Secret" $ns "backup-runner-token" }}
{{- $token := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "token") }}
{{-   $token = index $existing.data "token" }}
{{- else }}
{{-   $token = randAlphaNum 40 | b64enc }}
{{- end }}
{{- /*
  Helm validates ownership of every resource in the manifest BEFORE running
  pre-install/pre-upgrade hooks, so an existing Secret without Helm ownership
  metadata (created out-of-band by the bundled OpenBao setup hook on <=2.3.0
  installs, or by that hook running before this chart on a fresh install) makes
  the whole install/upgrade fail with "invalid ownership metadata". Render the
  Secret only when it does not exist yet or is already owned by this release;
  otherwise leave the out-of-band Secret in place (the backend and CronJob keep
  reading it) and let the adopt hook stamp ownership so the next upgrade adopts
  it cleanly.
*/}}
{{- $ownedByUs := and $existing
      (eq (dig "metadata" "labels" "app.kubernetes.io/managed-by" "" $existing) "Helm")
      (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing) .Release.Name)
      (eq (dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $existing) .Release.Namespace) }}
{{- if or (not $existing) $ownedByUs }}
apiVersion: v1
kind: Secret
metadata:
  name: backup-runner-token
  namespace: {{ $ns }}
  labels:
    app: backup
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    # Never garbage-collect the token: a rollback to a revision that (because of
    # the adoption step above) did not render this Secret would otherwise delete
    # it while the backend and backup CronJob still mount it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ $token | quote }}
{{- end }}
{{- end }}
