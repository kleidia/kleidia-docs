{{- /* External mode: the customer owns Vault backup/DR, so Kleidia does not snapshot it. */ -}}
{{- if and .Values.backup.enableVaultBackup (ne (.Values.global.secretsBackend.mode | default "bundled") "external") }}
# =============================================================================
# Scheduled OpenBao raft-snapshot backup (thin trigger).
# =============================================================================
# DB backups are handled NATIVELY by CNPG (barmanObjectStore + continuous WAL +
# the ScheduledBackup CRD in the kleidia-data chart), which provides PITR. This
# CronJob covers the OTHER half — OpenBao — which has no operator-native backup.
#
# It is intentionally a thin trigger: it POSTs to the backend, which performs the
# raft snapshot via its OpenBao client and streams it to S3. This keeps S3 creds
# and snapshot logic in one place (the backend) and avoids fragile in-container
# tooling (no `apk add`, no busybox-wget PUT quirks, airgap-friendly).
#
# DR WARNING: a raft snapshot is ENCRYPTED by the static seal and is NOT
# restorable without the unseal key (secret openbao-unseal-key) plus the
# init/recovery keys. Those must be custodied securely OFF-cluster — see
# docs/BACKUP_DR.md. The snapshot alone is not a complete backup.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kleidia-backup
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backup
spec:
  # Schedule from settings (default: daily at 2 AM).
  schedule: {{ .Values.backup.schedule | default "0 2 * * *" }}
  suspend: {{ .Values.backup.suspend | default false }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600  # Clean up after 1 hour
      # Surface a stuck/failing trigger instead of retrying forever.
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: backup
        spec:
          restartPolicy: OnFailure
          {{- if .Values.global.imagePullSecrets }}
          imagePullSecrets:
          {{- range .Values.global.imagePullSecrets }}
            - name: {{ . }}
          {{- end }}
          {{- else if .Values.global.registry.authSecret }}
          imagePullSecrets:
            - name: {{ .Values.global.registry.authSecret }}
          {{- end }}
          {{- if .Values.global.nodeSelector }}
          nodeSelector:
            {{- toYaml .Values.global.nodeSelector | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: trigger-openbao-snapshot
            image: {{ include "kleidia-services.thirdPartyImage" (dict "image" .Values.thirdPartyImages.curl "context" $) }}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              capabilities:
                drop: ["ALL"]
            command:
            - sh
            - -c
            - |
              set -eu
              echo "=== Triggering scheduled OpenBao raft snapshot ==="
              BACKEND_URL="http://backend.{{ .Values.global.namespace }}.svc.cluster.local:8080"

              # The backend takes the raft snapshot (sys/storage/raft/snapshot),
              # uploads it to S3, and records a backup job. Fails loudly (non-2xx
              # -> curl --fail -> non-zero exit) so a broken backup is visible
              # instead of masked.
              RESP=$(curl -fsS --max-time 540 -X POST \
                -H "X-Internal-Token: ${BACKUP_RUNNER_TOKEN}" \
                "${BACKEND_URL}/api/admin/system/backup/openbao-snapshot") || {
                  echo "ERROR: OpenBao snapshot trigger failed"; exit 1; }
              echo "✅ ${RESP}"
            env:
            - name: BACKUP_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backup-runner-token
                  key: token
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "200m"
{{- end }}
