{{- if .Values.mtls.enabled }}
# =============================================================================
# CA Certificate Bundle for mTLS Trust Distribution
# =============================================================================
# This ConfigMap holds the CA certificate chain that services use to verify
# peer certificates. It is automatically populated by the fetch-mtls-ca Job
# after OpenBao PKI is initialized.
#
# For intermediate CA mode: contains the full chain (intermediate + root)
# For root CA mode: contains just the root CA
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: kleidia-mtls-ca
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: kleidia
    app.kubernetes.io/component: mtls-ca-bundle
  annotations:
    description: "CA certificate chain for mTLS verification. Auto-populated by fetch-mtls-ca job."
data:
  ca.crt: ""
---
# ServiceAccount for the CA fetch job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtls-ca-updater
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: kleidia
    app.kubernetes.io/component: mtls-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "35"
    "helm.sh/hook-delete-policy": before-hook-creation
---
# Role to update the CA ConfigMap
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mtls-ca-updater
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: kleidia
    app.kubernetes.io/component: mtls-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "35"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["kleidia-mtls-ca"]
  verbs: ["get", "update", "patch"]
---
# RoleBinding for the CA updater
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mtls-ca-updater
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: kleidia
    app.kubernetes.io/component: mtls-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "35"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mtls-ca-updater
subjects:
- kind: ServiceAccount
  name: mtls-ca-updater
  namespace: {{ .Values.global.namespace }}
---
# Job to fetch CA certificate chain from OpenBao and update ConfigMap
apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-mtls-ca
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: kleidia
    app.kubernetes.io/component: mtls-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "40"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kleidia
        app.kubernetes.io/component: mtls-setup
    spec:
      serviceAccountName: mtls-ca-updater
      restartPolicy: OnFailure
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- $ext := eq (.Values.global.secretsBackend.mode | default "bundled") "external" }}
      {{- $pki := ternary (.Values.global.externalVault.pkiMount | default "pki") "pki" $ext }}
      {{- $addr := printf "http://kleidia-platform-openbao.%s.svc.cluster.local:8200" .Values.global.namespace }}
      {{- if $ext }}{{- $addr = (required "global.externalVault.address is required when secretsBackend.mode=external" .Values.global.externalVault.address) }}{{- end }}
      {{- $extCA := and $ext .Values.global.externalVault.caSecret }}
      containers:
      - name: fetch-ca
        image: {{ if .Values.global.registry.host }}{{ .Values.global.registry.host }}/{{ end }}alpine/k8s:1.28.4
        {{- if $extCA }}
        volumeMounts:
        - name: vault-ca
          mountPath: /etc/vault-tls
          readOnly: true
        {{- end }}
        command:
        - sh
        - -c
        - |
          set -e

          NAMESPACE="{{ .Values.global.namespace }}"
          OPENBAO_ADDR="{{ $addr }}"
          PKI_MOUNT="{{ $pki }}"
          CONFIGMAP_NAME="kleidia-mtls-ca"
          # TLS options for reaching the (external) Vault. CA cert/CRL endpoints are
          # unauthenticated, so no token is needed — only TLS trust may apply.
          CURL_TLS=""
          {{- if $extCA }}
          CURL_TLS="--cacert /etc/vault-tls/ca.crt"
          {{- else if and $ext .Values.global.externalVault.tlsSkipVerify }}
          CURL_TLS="-k"
          {{- end }}

          echo "=== Fetching CA Certificate Chain from {{ if $ext }}external {{ end }}Vault ==="
          echo "Vault address: ${OPENBAO_ADDR} (PKI mount: ${PKI_MOUNT})"

          # Wait for Vault to be ready and unsealed
          echo "Waiting for Vault to be ready..."
          RETRIES=0
          MAX_RETRIES=60
          until curl -sf $CURL_TLS "${OPENBAO_ADDR}/v1/sys/health" 2>/dev/null | grep -q '"initialized":true'; do
            RETRIES=$((RETRIES + 1))
            if [ $RETRIES -ge $MAX_RETRIES ]; then
              echo "ERROR: Vault not ready after ${MAX_RETRIES} attempts"
              exit 1
            fi
            echo "Waiting for Vault... (attempt ${RETRIES}/${MAX_RETRIES})"
            sleep 2
          done
          echo "✅ Vault is ready"

          # Wait for PKI to be mounted and have a CA
          echo "Waiting for PKI CA to be available..."
          RETRIES=0
          until curl -sf $CURL_TLS "${OPENBAO_ADDR}/v1/${PKI_MOUNT}/ca/pem" 2>/dev/null | grep -q "BEGIN CERTIFICATE"; do
            RETRIES=$((RETRIES + 1))
            if [ $RETRIES -ge $MAX_RETRIES ]; then
              echo "ERROR: PKI CA not available after ${MAX_RETRIES} attempts"
              exit 1
            fi
            echo "Waiting for PKI CA... (attempt ${RETRIES}/${MAX_RETRIES})"
            sleep 2
          done
          echo "✅ PKI CA is available"

          # Try to fetch the full CA chain first (for intermediate CA mode)
          # Falls back to single CA if chain endpoint returns empty or error
          echo "Fetching CA certificate chain..."
          CA_CHAIN=$(curl -sf $CURL_TLS "${OPENBAO_ADDR}/v1/${PKI_MOUNT}/ca_chain" 2>/dev/null || true)

          if [ -z "$CA_CHAIN" ] || ! echo "$CA_CHAIN" | grep -q "BEGIN CERTIFICATE"; then
            echo "CA chain not available, fetching single CA certificate..."
            CA_CHAIN=$(curl -sf $CURL_TLS "${OPENBAO_ADDR}/v1/${PKI_MOUNT}/ca/pem")
          fi
          
          if [ -z "$CA_CHAIN" ] || ! echo "$CA_CHAIN" | grep -q "BEGIN CERTIFICATE"; then
            echo "ERROR: Failed to fetch CA certificate"
            exit 1
          fi
          
          # Count certificates in chain
          CERT_COUNT=$(echo "$CA_CHAIN" | grep -c "BEGIN CERTIFICATE" || echo "0")
          echo "✅ Fetched CA chain with ${CERT_COUNT} certificate(s)"
          
          # Update the ConfigMap with the CA chain
          echo "Updating ConfigMap ${CONFIGMAP_NAME}..."
          
          # Create a temporary file with the CA chain
          TEMP_FILE=$(mktemp)
          echo "$CA_CHAIN" > "$TEMP_FILE"
          
          # Patch the ConfigMap using kubectl
          kubectl create configmap "${CONFIGMAP_NAME}" \
            --from-file=ca.crt="$TEMP_FILE" \
            --dry-run=client -o yaml | \
            kubectl apply -f - -n "${NAMESPACE}"
          
          rm -f "$TEMP_FILE"
          
          echo "✅ ConfigMap ${CONFIGMAP_NAME} updated successfully"
          
          # Verify the update
          STORED_CERTS=$(kubectl get configmap "${CONFIGMAP_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.ca\.crt}' | grep -c "BEGIN CERTIFICATE" || echo "0")
          echo "✅ Verified: ConfigMap contains ${STORED_CERTS} certificate(s)"
      {{- if $extCA }}
      volumes:
      - name: vault-ca
        secret:
          secretName: {{ .Values.global.externalVault.caSecret }}
          items:
            - key: ca.crt
              path: ca.crt
      {{- end }}
{{- end }}
