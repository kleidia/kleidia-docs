global:
  namespace: kleidia          # Kubernetes namespace to install into
  domain: ""                  # Domain name (e.g., "kleidia.example.com"). If set, siteUrl defaults to https://<domain>
  siteUrl: ""                 # Full site URL (e.g., "https://kleidia.example.com"). Overrides domain if set.
                              # Used for OIDC redirects and CORS configuration
  registry:
    host: ""                  # Optional: container registry host for all images (required for air-gapped environments)
                              # Example: "registry.example.com:5000"
                              # When set, ALL images will be pulled from this registry
                              # If empty, images are pulled from the repository names below (Docker Hub or other fully qualified repos).
    authSecret: ""            # Optional: name of a docker-registry secret for private registries (e.g. "regcred").
                              # You can create it with:
                              #   kubectl create secret docker-registry regcred \
                              #     --docker-server=registry.mycorp.local:5000 \
                              #     --docker-username=USER --docker-password=PASS -n <namespace>
  imagePullSecrets: []        # Optional: list of imagePullSecrets to attach to pods. Example: ["regcred"]
                             # If set, these take precedence over global.registry.authSecret.

  # Secrets backend: where Kleidia stores secrets and issues certificates.
  #   bundled  - Kleidia installs and operates OpenBao (default; kleidia-platform chart).
  #   external - Customer-managed Vault/OpenBao; Kleidia only consumes an endpoint + AppRole creds.
  #              The customer owns provisioning, PKI, sealing, HA, and backup/DR.
  #              See docs/EXTERNAL_VAULT.md for the required mounts/roles/policy.
  secretsBackend:
    mode: bundled
  externalVault:
    address: ""                 # REQUIRED in external mode, e.g. "https://vault.corp.example:8200"
    namespace: ""               # Vault Enterprise namespace (X-Vault-Namespace); empty for OSS/OpenBao
    kvMount: "yubikeys"         # KV v2 mount Kleidia reads/writes on the external Vault
    pkiMount: "pki"             # PKI mount Kleidia signs/issues against on the external Vault
    appRoleSecret: "kleidia-vault-approle"  # customer-created k8s Secret with keys: role_id, secret_id
    caSecret: ""                # optional k8s Secret holding ca.crt for TLS to the external Vault
    tlsSkipVerify: false        # dev/test only

# Third-party image repositories (can be mirrored to private registry for air-gapped deployments)
# When global.registry.host is set, these images will be pulled from: <registry.host>/<repository>:<tag>
thirdPartyImages:
  postgres: "postgres:18.1-alpine"   # Ad-hoc psql/pg_dump utility (DB backups are now CNPG-native)
  curl: "curlimages/curl:latest"     # Health checks + the backup CronJob trigger
  # NOTE: OpenBao snapshots are taken by the backend (Go OpenBao client), not a
  # vault CLI container, so no vault/openbao image is needed for backups.

backend:
  replicas: 2                 # Horizontal scaling for the backend API
  image:
    repository: therinn/kleidia  # Repository name. Use a fully-qualified repo if pulling from Docker Hub/GHCR (e.g. myorg/kleidia-backend)
    tag: backend-2.3.0                    # Pinned to the 2.3.0 release. Keep in lockstep with Chart version (see AGENTS.md "Versioning").
  service:
    nodePort: 32570             # NodePort exposed to the external load balancer (must be within your cluster's NodePort range)
  corsOrigins: ""               # CORS allowed origins (comma-separated). If empty, uses global.siteUrl
                                # Example: "https://kleidia.example.com,https://frontend.example.com"
                                # REQUIRED for production deployments with external load balancers
  oidc:
    skipTlsVerify: true         # Skip TLS verification for OIDC discovery (set to false in production with proper certificates)
  # CNPG backup S3 credentials secret name (the backend creates/patches against it).
  # Keep in sync with kleidia-data's cnpg.backup.s3CredentialsSecret if you change it.
  cnpgS3SecretName: "cnpg-backup-s3-credentials"
  resources:
    requests:
      memory: "512Mi"           # Memory request (increase for large backups)
      cpu: "100m"
    limits:
      memory: "1Gi"             # Memory limit - must handle pg_dump + encryption of full database
      cpu: "500m"

frontend:
  replicas: 2                 # Horizontal scaling for the frontend
  image:
    repository: therinn/kleidia  # Repository name. Use a fully-qualified repo if pulling from Docker Hub/GHCR (e.g. myorg/kleidia-frontend)
    tag: frontend-2.3.0                   # Pinned to the 2.3.0 release. Keep in lockstep with Chart version (see AGENTS.md "Versioning").
  service:
    nodePort: 30805             # NodePort exposed to the external load balancer (must be within your cluster's NodePort range)

licenseService:
  enabled: true                 # Enable the license service pod (optional, backend falls back to TRIAL if disabled)
  replicas: 2                   # Horizontal scaling for high availability
  image: therinn/kleidia:license-2.3.0  # License service image (garble-obfuscated); pinned to the 2.3.0 release
  imagePullPolicy: Always       # Always pull to ensure latest image
  resources:
    requests:
      memory: "32Mi"            # Minimal memory footprint
      cpu: "50m"                # Minimal CPU usage
    limits:
      memory: "128Mi"           # Memory limit
      cpu: "200m"               # CPU limit
  networkPolicy:
    enabled: true               # Enable network policy to restrict access to backend only

backup:
  # Scheduled OpenBao raft-snapshot backup. DB backups are CNPG-native (see the
  # kleidia-data chart: barmanObjectStore + ScheduledBackup), not part of this job.
  schedule: "0 2 * * *"        # Cron schedule (default: daily at 2 AM)
  suspend: false                # Set to true to pause the scheduled snapshot
  enableVaultBackup: true       # Render the OpenBao raft-snapshot CronJob
                                # (requires raft storage; backend performs the snapshot)

# =============================================================================
# SECURITY AUTOMATION
# =============================================================================

# External Secrets Operator configuration
# Syncs secrets from OpenBao to Kubernetes Secrets automatically
externalSecrets:
  enabled: false                # Set to true to enable ESO integration
                                # Requires ESO to be installed in cluster:
                                # helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
  refreshInterval: "1h"         # How often to sync secrets from OpenBao (default: 1 hour)

# Mutual TLS configuration for inter-service communication
# When enabled, all services communicate over HTTPS with certificate verification
mtls:
  enabled: true                 # mTLS enabled by default for security
                                # Requires: 1) cert-manager installed in cluster
                                #           2) kleidia-platform deployed with OpenBao initialized
                                # Set to false only for development/testing without TLS
  openbaoTLS: false             # Set to true if OpenBao uses TLS (matches openbao.internalTLS.enabled)
  
  # Certificate lifecycle
  certificateDuration: "24h"    # How long certificates are valid
  renewBefore: "4h"             # Renew certificates this long before expiry
  
  # TLS security settings
  minVersion: "1.3"             # Minimum TLS version (TLS 1.3 required for security)
  clientAuth: "require"         # Client auth mode: require, request, optional

# =============================================================================
# DATABASE TLS CONFIGURATION
# =============================================================================
# When CNPG is deployed with TLS enabled (kleidia-data chart), the backend
# can connect to PostgreSQL using TLS encryption and client certificates.
# This is automatically detected based on the existence of the client cert secret.
#
# NOTE: This only works with CNPG (K8s 1.32+). Legacy PostgreSQL does not support TLS.
# =============================================================================
database:
  tls:
    enabled: true               # Enable TLS for PostgreSQL connections
                                # Requires: kleidia-db-client-tls secret from kleidia-data chart
                                # If secret doesn't exist, falls back to non-TLS connection
    sslMode: "verify-full"      # PostgreSQL SSL mode: disable, require, verify-ca, verify-full
                                # verify-full: verify server cert and hostname (most secure)
    clientCertSecret: "kleidia-db-client-tls"  # Secret containing client certificate
    caSecret: "kleidia-db-ca"   # Secret containing CA certificate

